name: Deploy PocketBase (Docker) to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy files to VM via SSH/rsync
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # 1. Point source paths to the backend/ folder
          source: "backend/docker-compose.yml,backend/pb_migrations/,backend/pb_hooks/"
          target: "/home/${{ secrets.REMOTE_USER }}/pocketbase/"
          # 2. Strip "backend/" from the folder structure so they land flat
          strip_components: 1

      - name: Restart PocketBase Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.REMOTE_USER }}/pocketbase
            # Pull new images (if any) and recreate/restart the container
            sudo docker compose pull
            sudo docker compose up -d --force-recreate
            echo "PocketBase container successfully redeployed!"