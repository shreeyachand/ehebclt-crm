name: Deploy PocketBase (Docker) to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_PB_URL: ${{ secrets.VITE_PB_URL }}
          VITE_PB_SUPERUSER_EMAIL: ${{ secrets.VITE_PB_SUPERUSER_EMAIL }}
          VITE_PB_SUPERUSER_PASSWORD: ${{ secrets.VITE_PB_SUPERUSER_PASSWORD }}

      - name: Stage Frontend Build into pb_public
        run: |
          mkdir -p backend/pb_public
          cp -R frontend/dist/. backend/pb_public/

      - name: Deploy files to VM via SSH/rsync
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "backend/Dockerfile,backend/entrypoint.sh,backend/docker-compose.yml,backend/Caddyfile,backend/pb_migrations/,backend/pb_hooks/,backend/pb_public/"
          target: "/home/${{ secrets.REMOTE_USER }}/pocketbase/"
          strip_components: 1

      - name: Restart PocketBase Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.REMOTE_USER }}/pocketbase
            sudo docker compose up -d --build --force-recreate
            echo "PocketBase container successfully redeployed!"
