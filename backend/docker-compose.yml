version: "3.8"

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest # or whatever image you are using
    container_name: pocketbase
    ports:
      - "8090:8090"
    volumes:
      # This maps the folders to your local computer:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
    restart: unless-stopped