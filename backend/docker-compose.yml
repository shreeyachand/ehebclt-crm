services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POCKETBASE_VERSION: ${POCKETBASE_VERSION:-0.39.8}
    container_name: pocketbase
    cap_drop:
      - ALL
    ports:
      - "8090:8090"
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
    volumes:
      # This maps the folders to your local computer:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations:ro
      - ./pb_hooks:/pb_hooks:ro
      - ./pb_public:/pb_public:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - pocketbase_internal
    command: serve --http=0.0.0.0:8090 --dir=/pb_data --migrationsDir=/pb_migrations --hooksDir=/pb_hooks --publicDir=/pb_public
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pocketbase_internal
    depends_on:
      - pocketbase
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  pocketbase_internal: